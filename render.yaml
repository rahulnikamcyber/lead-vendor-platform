## Step 3: Check Your Branch Name

The error mentions "master branch". Let's check if your repository uses `main` or `master`:

1. Look at the top-left of your GitHub repository page
2. You'll see a dropdown that says either **"main"** or **"master"**

### If it says "main":
Go back to Render and change the branch:
- In the Render Blueprint page
- Find the **Branch** dropdown
- Change from `master` to `main`
- Click **"Retry"**

