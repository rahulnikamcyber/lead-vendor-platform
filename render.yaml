## Alternative: Manual Deployment (If Blueprint Still Fails)

If Blueprint still doesn't work, deploy manually:

### Option A: Deploy Web Service Only

1. In Render Dashboard, click **"New +"** → **"Web Service"**
2. Connect your GitHub repository
3. Fill in:
   - **Name:** `lead-vendor-platform`
   - **Branch:** `main` (or `master`)
   - **Runtime:** `Python 3`
   - **Build Command:** `pip install -r requirements.txt`
   - **Start Command:** `gunicorn main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT`
4. Click **"Create Web Service"**

### Option B: Add Database Separately

1. After web service is created, click **"New +"** → **"PostgreSQL"**
2. Name it: `lead-vendor-db`
3. Click **"Create Database"**
4. Once created, copy the **Internal Database URL**
5. Go to your web service → **Environment** tab
6. Add environment variable:
   - Key: `DATABASE_URL`
   - Value: [paste the database URL]
7. Click **"Save Changes"**

