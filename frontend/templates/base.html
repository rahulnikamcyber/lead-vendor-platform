<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lead Vendor Platform{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/custom.css">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    
    <!-- Navigation -->
    {% block navigation %}{% endblock %}
    
    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>
    
    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 right-4 z-50 hidden">
        <div class="bg-white border-l-4 border-blue-500 shadow-lg rounded-lg p-4 max-w-md">
            <div class="flex items-center">
                <div class="flex-shrink-0">
                    <svg class="h-6 w-6 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div class="ml-3">
                    <p id="toast-message" class="text-sm font-medium text-gray-900"></p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Common Scripts -->
    <script>
        // Toast notification
        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = toast.querySelector('svg');
            const toastBorder = toast.querySelector('div > div');
            
            toastMessage.textContent = message;
            
            // Set color based on type
            if (type === 'success') {
                toastBorder.className = 'bg-white border-l-4 border-green-500 shadow-lg rounded-lg p-4 max-w-md';
                toastIcon.className = 'h-6 w-6 text-green-500';
            } else if (type === 'error') {
                toastBorder.className = 'bg-white border-l-4 border-red-500 shadow-lg rounded-lg p-4 max-w-md';
                toastIcon.className = 'h-6 w-6 text-red-500';
            } else {
                toastBorder.className = 'bg-white border-l-4 border-blue-500 shadow-lg rounded-lg p-4 max-w-md';
                toastIcon.className = 'h-6 w-6 text-blue-500';
            }
            
            toast.classList.remove('hidden');
            
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
        
        // Get auth token
        function getAuthToken() {
            return localStorage.getItem('access_token');
        }
        
        // Set auth token
        function setAuthToken(token) {
            localStorage.setItem('access_token', token);
        }
        
        // Clear auth token
        function clearAuthToken() {
            localStorage.removeItem('access_token');
        }
        
        // API call helper
        async function apiCall(url, options = {}) {
            const token = getAuthToken();
            const headers = {
                'Content-Type': 'application/json',
                ...options.headers
            };
            
            if (token) {
                headers['Authorization'] = `Bearer ${token}`;
            }
            
            const response = await fetch(url, {
                ...options,
                headers
            });
            
            if (response.status === 401) {
                clearAuthToken();
                window.location.href = '/login';
                return;
            }
            
            return response;
        }
    </script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
