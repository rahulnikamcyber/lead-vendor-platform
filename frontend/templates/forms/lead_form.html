{% extends "base.html" %}

{% block title %}Submit Lead - Lead Vendor Platform{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-2xl mx-auto">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-900">Submit Your Requirement</h2>
            <p class="mt-2 text-gray-600">We'll connect you with relevant service providers</p>
        </div>
        
        <!-- Form -->
        <div class="bg-white shadow-lg rounded-lg p-8">
            <form id="leadForm" class="space-y-6">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Full Name *</label>
                    <input type="text" name="full_name" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Mobile Number *</label>
                    <input type="tel" name="mobile" required pattern="[0-9]{10}"
                           placeholder="10-digit mobile number"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">City *</label>
                    <input type="text" name="city" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Service Type *</label>
                    <select name="service_type" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">Select Service</option>
                        <option value="Solar">Solar Installation</option>
                        <option value="Electrical">Electrical Work</option>
                        <option value="Plumbing">Plumbing</option>
                        <option value="Construction">Construction</option>
                        <option value="Renovation">Renovation</option>
                        <option value="Painting">Painting</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Budget Range</label>
                    <select name="budget_range"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">Select Budget</option>
                        <option value="Under 50k">Under ₹50,000</option>
                        <option value="50k-1L">₹50,000 - ₹1,00,000</option>
                        <option value="1L-2L">₹1,00,000 - ₹2,00,000</option>
                        <option value="2L-5L">₹2,00,000 - ₹5,00,000</option>
                        <option value="Above 5L">Above ₹5,00,000</option>
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Additional Notes</label>
                    <textarea name="notes" rows="4" placeholder="Any specific requirements or details..."
                              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
                
                <button type="submit" id="submitBtn"
                        class="w-full bg-blue-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-blue-700 transition">
                    Submit Lead
                </button>
                
            </form>
        </div>
        
        <!-- Success Message -->
        <div id="successMessage" class="hidden mt-8 bg-green-50 border border-green-200 rounded-lg p-6">
            <div class="flex items-center mb-4">
                <svg class="w-6 h-6 text-green-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                <h3 class="text-lg font-semibold text-green-900">Lead Submitted Successfully!</h3>
            </div>
            <p id="successText" class="text-green-700"></p>
            <a href="/" class="inline-block mt-4 text-blue-600 hover:text-blue-700 font-medium">
                ← Back to Home
            </a>
        </div>
        
    </div>
</div>

<script>
document.getElementById('leadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    const form = e.target;
    const formData = new FormData(form);
    const data = Object.fromEntries(formData);
    
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';
    
    try {
        const response = await fetch('/api/leads/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok) {
            form.classList.add('hidden');
            const successMessage = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            
            let message = `Your lead has been submitted with ID: ${result.lead_id}. `;
            if (result.vendors_notified > 0) {
                message += `${result.vendors_notified} vendor(s) have been notified and will contact you shortly.`;
            } else {
                message += `No matching vendors are currently available. We'll notify you when vendors are onboarded.`;
            }
            
            if (result.is_duplicate) {
                message = `We noticed you've already submitted a similar request. Your previous lead is still active.`;
            }
            
            successText.textContent = message;
            successMessage.classList.remove('hidden');
            
        } else {
            showToast(result.detail || 'Failed to submit lead', 'error');
        }
    } catch (error) {
        showToast('Error submitting lead. Please try again.', 'error');
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Lead';
    }
});
</script>
{% endblock %}
